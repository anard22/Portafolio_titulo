<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Arena Experience | Acceso</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="https://via.placeholder.com/60x60/1B5E8C/fff?text=SA" alt="Logo Smart Arena" class="logo">
    <h1>Smart Arena Experience</h1>
    <p class="subtitulo">Ingresa para acceder a tu estadio digital</p>

    <form id="form-login">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit" class="btn-primario">Iniciar sesión</button>
    </form>

    <p id="mensaje" class="mensaje" hidden></p>
    <p class="enlace"><a href="index.html">Volver al inicio</a></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
